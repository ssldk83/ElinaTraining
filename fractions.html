<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sammenlign brøker visuelt og se, hvor stor en del af helheden de fylder.">
  <title>Forstå brøker · Elinas læringsunivers</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --fill1: #5b8def;
      --fill2: #f39c5a;
      --good: #2f855a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px 44px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 46px);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 18px;
    }

    .compare-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-width: 980px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      border: 1px solid #ececf2;

      display: grid;
      grid-template-columns: minmax(420px, 1fr) 300px;
      grid-template-areas:
        "bar title"
        "bar meaning"
        "bar controls";
      column-gap: 20px;
      row-gap: 6px;
      align-items: center;
    }

    .fraction-title {
      grid-area: title;
      text-align: left;
      font-size: 34px;
      font-weight: 800;
      margin: 0;
      align-self: end;
    }

    .fraction {
      display: inline-grid;
      grid-template-rows: auto auto;
      line-height: 1;
      min-width: 48px;
    }

    .fraction .top {
      border-bottom: 3px solid currentColor;
      padding: 0 8px 5px;
    }

    .fraction .bottom {
      padding: 5px 8px 0;
    }

    .bar-shell {
      grid-area: bar;
      position: relative;
      height: 74px;
      border: 3px solid #30343b;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      margin: 0;
      cursor: pointer;
      user-select: none;
      align-self: center;
    }

    .fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      transition: width .45s ease;
    }

    .card:nth-child(1) .fill { background: var(--fill1); }
    .card:nth-child(2) .fill { background: var(--fill2); }

    .segments {
      position: absolute;
      inset: 0;
      display: grid;
      pointer-events: none;
    }

    .segment {
      border-right: 2px solid rgba(31,41,55,.55);
    }

    .segment:last-child { border-right: 0; }

    .meaning {
      grid-area: meaning;
      text-align: left;
      font-size: 15px;
      color: var(--muted);
      min-height: 0;
      margin: 0;
    }

    .controls {
      grid-area: controls;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
      align-self: start;
    }

    label {
      font-size: 14px;
      color: var(--muted);
      display: grid;
      gap: 6px;
    }

    select, input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: white;
      font-size: 16px;
    }

    

    

    

    

    

    

    

    

    

    .decimal-control { grid-column: 1 / -1; }
    .decimal-feedback { color: #b91c1c; min-height: 1.2em; font-size: 13px; }
    .decimal-value { font-size: 24px; margin-left: 12px; }
    .tip {
      text-align: center;
      margin-top: 22px;
      color: var(--muted);
      font-size: 15px;
    }

    @media (max-width: 780px) {
      .card {
        grid-template-columns: 1fr;
        grid-template-areas:
          "title"
          "bar"
          "meaning"
          "controls";
        gap: 10px;
      }

      .fraction-title,
      .meaning {
        text-align: center;
      }
    }

    .practice { max-width:980px; margin:0 auto 28px; padding:24px; background:white; border:1px solid var(--line); border-radius:16px; }
    .practice h2 { margin-top:0; }
    .practice-options, .practice-answers { display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
    .practice-options label { flex:1; min-width:180px; }
    .practice-question { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:24px; margin:24px 0; font-size:28px; }
    .practice-question svg { width:170px; height:170px; }
    .practice-answers { justify-content:center; }
    .practice-fraction { display:grid; gap:6px; width:90px; }
    .practice-fraction label:first-child { border-bottom:2px solid var(--text); padding-bottom:8px; }
    .practice-answers > label { width:160px; }
    .practice button { padding:12px 18px; border:1px solid var(--line); border-radius:10px; background:#eef2ff; font:inherit; cursor:pointer; }
    .practice button:disabled { opacity:.5; cursor:default; }
    .practice-actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:20px; }
    #practiceFeedback { min-height:2.5em; text-align:center; margin:18px 0 0; }
    [hidden] { display:none !important; }

  </style>
  <link rel="stylesheet" href="shared.css">
  <script defer src="shared.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>Forstå brøker</h1>
    <div class="subtitle">
      Se brøker som decimaltal, eller skriv fx 0,6 og se 6/10.
    </div>


    <section class="practice" aria-labelledby="practiceTitle">
      <h2 id="practiceTitle">Øv dig: Brøker og decimaltal</h2>
      <div class="practice-options">
        <label>Opgavetype
          <select id="practiceMode">
            <option value="picture">Figur → brøk og decimaltal</option>
            <option value="decimal">Brøk → decimaltal</option>
            <option value="fraction">Decimaltal → brøk</option>
          </select>
        </label>
        <label>Niveau
          <select id="practiceLevel">
            <option value="easy">Tiendedele og femtedele</option>
            <option value="mixed">Blandet: 2, 4, 5, 10 og 20 dele</option>
          </select>
        </label>
      </div>
      <p id="practiceProgress" role="status"></p>
      <p id="practiceInstruction"></p>
      <div class="practice-question" id="practiceQuestion"></div>
      <form id="practiceForm" novalidate>
        <div class="practice-answers">
          <div class="practice-fraction" id="practiceFractionFields">
            <label>Tæller<input id="answerNumerator" inputmode="numeric" type="text" autocomplete="off" aria-describedby="practiceFeedback"></label>
            <label>Nævner<input id="answerDenominator" inputmode="numeric" type="text" autocomplete="off" aria-describedby="practiceFeedback"></label>
          </div>
          <span id="practiceEquals" aria-hidden="true">=</span>
          <label id="practiceDecimalField">Decimaltal<input id="answerDecimal" inputmode="decimal" type="text" autocomplete="off" placeholder="Fx 0,6" aria-describedby="practiceFeedback"></label>
        </div>
        <div class="practice-actions">
          <button type="submit" id="practiceCheck">Tjek svar</button>
          <button type="button" id="practiceHint">Tip</button>
          <button type="button" id="practiceNext" disabled>Næste opgave →</button>
        </div>
        <p id="practiceFeedback" role="status" aria-live="polite"></p>
      </form>
    </section>
    <h2 style="text-align:center">Udforsk selv</h2>

    <section class="compare-row">
      <div class="card">
        <div class="fraction-title">
          <span class="fraction">
            <span class="top" id="n1Text">4</span>
            <span class="bottom" id="d1Text">7</span>
          </span><span class="decimal-value" id="decimal1Text"></span>
        </div>

        <div class="bar-shell" id="bar1" title="Klik for at afspille igen">
          <div class="fill" id="fill1"></div>
          <div class="segments" id="segments1"></div>
        </div>

        <div class="meaning" id="meaning1"></div>

        <div class="controls">
          <label>
            Tæller
            <select id="n1"></select>
          </label>
          <label>
            Nævner
            <select id="d1"></select>
          </label>
          <label class="decimal-control">
            Skriv et decimaltal fra 0 til 1 (fx 0,6)
            <input id="decimal1" type="text" inputmode="decimal" autocomplete="off" placeholder="0,6" aria-describedby="decimal1Feedback">
            <span class="decimal-feedback" id="decimal1Feedback" role="status"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="fraction-title">
          <span class="fraction">
            <span class="top" id="n2Text">2</span>
            <span class="bottom" id="d2Text">3</span>
          </span><span class="decimal-value" id="decimal2Text"></span>
        </div>

        <div class="bar-shell" id="bar2" title="Klik for at afspille igen">
          <div class="fill" id="fill2"></div>
          <div class="segments" id="segments2"></div>
        </div>

        <div class="meaning" id="meaning2"></div>

        <div class="controls">
          <label>
            Tæller
            <select id="n2"></select>
          </label>
          <label>
            Nævner
            <select id="d2"></select>
          </label>
          <label class="decimal-control">
            Skriv et decimaltal fra 0 til 1 (fx 0,6)
            <input id="decimal2" type="text" inputmode="decimal" autocomplete="off" placeholder="0,6" aria-describedby="decimal2Feedback">
            <span class="decimal-feedback" id="decimal2Feedback" role="status"></span>
          </label>
        </div>
      </div>
    </section>

    <div class="tip">
      Tip: Dæk de skrevne brøker med hånden, og sammenlign kun længden på de to bjælker.
    </div>
  </main>

  <script>
    const state = {
      n1: 4, d1: 7,
      n2: 2, d2: 3
    };

    const $ = id => document.getElementById(id);

    function fillSelect(select, min, max, selected) {
      select.innerHTML = "";
      for (let i = min; i <= max; i++) {
        const op = document.createElement("option");
        op.value = i;
        op.textContent = i;
        if (i === selected) op.selected = true;
        select.appendChild(op);
      }
    }

    function drawSegments(container, denominator) {
      container.innerHTML = "";
      container.style.gridTemplateColumns = `repeat(${denominator}, 1fr)`;
      for (let i = 0; i < denominator; i++) {
        const seg = document.createElement("div");
        seg.className = "segment";
        container.appendChild(seg);
      }
    }

    function words(n, d) {
      const names = {
        2: "halvdele",
        3: "tredjedele",
        4: "fjerdedele",
        5: "femtedele",
        6: "sjettedele",
        7: "syvendedele",
        8: "ottendedele",
        9: "niendedele",
        10: "tiendedele",
        11: "ellevtedele",
        12: "tolvtedele"
      };
      return `${n} af ${d} lige store dele er farvet (${n} ${names[d] || "dele"}).`;
    }

    function fracHTML(n, d) {
      return `<span class="fraction"><span class="top">${n}</span><span class="bottom">${d}</span></span>`;
    }

    function formatDecimal(n, d) {
      let remainder = d;
      for (const factor of [2, 5]) {
        while (remainder % factor === 0) remainder /= factor;
      }
      const exact = remainder === 1;
      return (exact ? "= " : "≈ ") + (n / d).toLocaleString("da-DK", { maximumFractionDigits: 4 });
    }

    function applyDecimal(side) {
      const input = $("decimal" + side);
      const value = input.value.trim();
      if (!/^(?:0(?:[,.]\d{1,2})?|1(?:[,.]0{1,2})?)$/.test(value)) {
        $("decimal" + side + "Feedback").textContent = "Skriv et tal fra 0 til 1 med højst to decimaler, fx 0,6.";
        input.setAttribute("aria-invalid", "true");
        return;
      }
      const normalized = value.replace(",", ".");
      const digits = (normalized.split(".")[1] || "").length;
      const d = digits ? 10 ** digits : 10;
      const n = Math.round(Number(normalized) * d);
      state["n" + side] = n;
      state["d" + side] = d;
      fillSelect($("d" + side), 2, 12, d);
      if (d > 12) {
        const option = document.createElement("option");
        option.value = d;
        option.textContent = d;
        option.selected = true;
        $("d" + side).appendChild(option);
      }
      setNumeratorOptions(side);
      update();
      markExplored();
    }

    function update() {
      for (const side of [1, 2]) {
        const n = state["n" + side];
        const d = state["d" + side];
        const pct = 100 * n / d;

        $("n" + side + "Text").textContent = n;
        $("d" + side + "Text").textContent = d;
        $("fill" + side).style.width = pct + "%";
        drawSegments($("segments" + side), d);
        $("meaning" + side).textContent = words(n, d);
        $("decimal" + side + "Text").textContent = formatDecimal(n, d);
        $("decimal" + side).value = (n / d).toLocaleString("da-DK", { maximumFractionDigits: 4 });
        $("decimal" + side).removeAttribute("aria-invalid");
        $("decimal" + side + "Feedback").textContent = "";
      }
    }

    function setNumeratorOptions(side) {
      const d = state["d" + side];
      const select = $("n" + side);
      const old = Math.min(state["n" + side], d);
      fillSelect(select, 0, d, old);
      state["n" + side] = old;
    }

    let fractionExplorations = 0;
    function markExplored() {
      fractionExplorations++;
      if (fractionExplorations % 3 === 0) {
        window.LearningUniverse?.earnStar("fractions", "Du har udforsket tre brøker!");
      }
    }

    fillSelect($("d1"), 2, 12, state.d1);
    fillSelect($("d2"), 2, 12, state.d2);
    fillSelect($("n1"), 0, state.d1, state.n1);
    fillSelect($("n2"), 0, state.d2, state.n2);

    for (const side of [1, 2]) {
      $("decimal" + side).addEventListener("change", () => applyDecimal(side));
      $("decimal" + side).addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          applyDecimal(side);
        }
      });
      $("d" + side).addEventListener("change", e => {
        state["d" + side] = Number(e.target.value);
        setNumeratorOptions(side);
        update();
        markExplored();
      });

      $("n" + side).addEventListener("change", e => {
        state["n" + side] = Number(e.target.value);
        update();
        markExplored();
      });

      $("bar" + side).addEventListener("click", () => {
        const fill = $("fill" + side);
        fill.style.width = "0%";
        requestAnimationFrame(() => {
          requestAnimationFrame(() => update());
        });
      });
    }

    

    

    update();

    const practice = { n:6, d:10, round:0, correct:0, solved:false, previous:"" };
    const decimalText = (n,d) => (n/d).toLocaleString("da-DK");
    function circleHTML(n,d) {
      let paths = "";
      for (let i=0; i<d; i++) {
        const a = 2*Math.PI*i/d-Math.PI/2;
        const b = 2*Math.PI*(i+1)/d-Math.PI/2;
        paths += `<path d="M 90 90 L ${90+80*Math.cos(a)} ${90+80*Math.sin(a)} A 80 80 0 0 1 ${90+80*Math.cos(b)} ${90+80*Math.sin(b)} Z" fill="${i<n ? "#84b547" : "#fff"}" stroke="#374151" stroke-width="2"/>`;
      }
      return `<svg viewBox="0 0 180 180" role="img" aria-label="${n} af ${d} lige store dele er farvet">${paths}</svg>`;
    }
    function newPractice(reset=false) {
      if (reset || practice.round === 10) { practice.round=0; practice.correct=0; }
      const ds = $("practiceLevel").value === "mixed" ? [2,4,5,10,20] : [5,10];
      let n,d,key;
      do {
        d=ds[Math.floor(Math.random()*ds.length)];
        n=Math.floor(Math.random()*(d+1));
        key=n+"/"+d;
      } while (key===practice.previous);
      Object.assign(practice,{n,d,round:practice.round+1,solved:false,previous:key});
      const mode=$("practiceMode").value;
      $("practiceFractionFields").hidden=mode==="decimal";
      $("practiceDecimalField").hidden=mode==="fraction";
      $("practiceEquals").hidden=mode!=="picture";
      $("practiceInstruction").textContent=mode==="picture" ? "Hvor stor en del er farvet? Skriv både brøken og decimaltallet." : mode==="decimal" ? "Skriv brøken som et decimaltal. Brug gerne komma." : "Skriv decimaltallet som en brøk.";
      $("practiceQuestion").innerHTML=mode==="picture" ? circleHTML(n,d) : mode==="decimal" ? fracHTML(n,d)+" = ?" : decimalText(n,d)+" = ?";
      for (const id of ["answerNumerator","answerDenominator","answerDecimal"]) { $(id).value=""; $(id).disabled=false; }
      $("practiceFeedback").textContent="";
      $("practiceCheck").disabled=false;
      $("practiceNext").disabled=true;
      $("practiceNext").textContent=practice.round===10 ? "Start 10 nye opgaver" : "Næste opgave →";
      $("practiceProgress").textContent=`Opgave ${practice.round} af 10 · ${practice.correct} løst`;
    }
    function checkPractice(e) {
      e.preventDefault();
      if(practice.solved) return;
      const mode=$("practiceMode").value;
      const a=$("answerNumerator").value.trim(), b=$("answerDenominator").value.trim();
      const decimal=$("answerDecimal").value.trim();
      const validFraction=/^\d{1,4}$/.test(a) && /^\d{1,4}$/.test(b) && Number(b)>0;
      const validDecimal=/^\d+(?:[,.]\d+)?$/.test(decimal);
      const fractionOK=validFraction && Number(a)*practice.d===practice.n*Number(b);
      const decimalOK=validDecimal && Math.abs(Number(decimal.replace(",","."))-practice.n/practice.d)<1e-9;
      if ((mode!=="decimal" && !validFraction) || (mode!=="fraction" && !validDecimal)) {
        $("practiceFeedback").textContent="Udfyld felterne med tal. Nævneren skal være større end 0. Brug fx 0,6 som decimaltal.";
        return;
      }
      if ((mode!=="decimal" && !fractionOK) || (mode!=="fraction" && !decimalOK)) {
        $("practiceFeedback").textContent=mode==="picture" ? "Prøv igen. Tæl alle delene og derefter de farvede. Decimaltallet er tæller ÷ nævner." : "Prøv igen. Brøken og decimaltallet skal have samme værdi.";
        return;
      }
      practice.solved=true; practice.correct++;
      $("practiceFeedback").textContent=`Rigtigt! ${practice.n}/${practice.d} = ${decimalText(practice.n,practice.d)}.` + (practice.round===10 ? " Flot, du har løst alle 10 opgaver!" : "");
      $("practiceProgress").textContent=`Opgave ${practice.round} af 10 · ${practice.correct} løst`;
      $("practiceCheck").disabled=true; $("practiceNext").disabled=false;
      for(const id of ["answerNumerator","answerDenominator","answerDecimal"]) $(id).disabled=true;
      window.LearningUniverse?.earnStar("fractions","Du løste en brøkopgave!");
    }
    $("practiceForm").addEventListener("submit",checkPractice);
    $("practiceNext").addEventListener("click",()=>newPractice());
    $("practiceMode").addEventListener("change",()=>newPractice(true));
    $("practiceLevel").addEventListener("change",()=>newPractice(true));
    $("practiceHint").addEventListener("click",()=>{
      $("practiceFeedback").textContent=$("practiceMode").value==="fraction" ? "Et ciffer efter kommaet er tiendedele. To cifre er hundrededele. Fx 0,7 = 7/10." : "Nævneren er alle delene, og tælleren er de farvede. Divider tælleren med nævneren for at finde decimaltallet.";
    });
    newPractice();

  </script>
</body>
</html>
